{% extends 'quiz/frontend/base.html' %}

{% block title %}创建班级 - 在线考试系统{% endblock %}

{% block extra_styles %}
<style>
    .form-container {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #2c3e50;
    }
    
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        transition: border-color 0.3s ease;
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #667eea;
    }
    
    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }
    
    .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 15px;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        width: 100%;
        justify-content: center;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
        background: #f5f7fa;
        color: #666;
        padding: 10px 20px;
        margin-right: 10px;
    }
    
    .btn-secondary:hover {
        background: #eee;
    }
    
    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }
    
    .required {
        color: #dc3545;
        margin-left: 4px;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="page-title" style="margin-bottom: 30px;">➕ 创建班级</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="code">班级编号 <span class="required">*</span></label>
            <input type="text" id="code" name="code" placeholder="请输入班级编号（如：CLASS001）" required>
            <div class="hint">💡 班级编号是唯一标识符，学生凭此编号申请加入班级</div>
        </div>
        
        <div class="form-group">
            <label for="name">班级名称 <span class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="请输入班级名称" required>
        </div>
        
        <div class="form-group">
            <label for="description">班级描述</label>
            <textarea id="description" name="description" placeholder="请输入班级描述（可选）"></textarea>
        </div>
        
        <div class="form-actions">
            <a href="{% url 'class_list' %}" class="btn btn-secondary">← 返回</a>
            <button type="submit" class="btn btn-primary">✓ 创建班级</button>
        </div>
    </form>
</div>
{% endblock %}
