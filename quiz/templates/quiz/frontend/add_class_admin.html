{% extends 'quiz/frontend/base.html' %}

{% block title %}添加班级管理员 - 在线考试系统{% endblock %}

{% block extra_styles %}
<style>
    .form-container {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #2c3e50;
    }
    
    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        transition: border-color 0.3s ease;
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }
    
    .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 15px;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
        background: #f5f7fa;
        color: #666;
        padding: 10px 20px;
    }
    
    .btn-secondary:hover {
        background: #eee;
    }
    
    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }
    
    .required {
        color: #dc3545;
        margin-left: 4px;
    }
    
    .class-info {
        background: #e7f3ff;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .class-info .icon {
        font-size: 28px;
    }
    
    .class-info .text {
        color: #0c63e4;
    }
    
    .class-info .text h4 {
        margin: 0;
        font-size: 16px;
    }
    
    .class-info .text p {
        margin: 4px 0 0 0;
        font-size: 13px;
        opacity: 0.8;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="page-title" style="margin-bottom: 25px;">➕ 添加班级管理员</h1>
    
    <div class="class-info">
        <span class="icon">🏫</span>
        <div class="text">
            <h4>{{ class_obj.name }}</h4>
            <p>为该班级添加管理员</p>
        </div>
    </div>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username">用户名 <span class="required">*</span></label>
            <input type="text" id="username" name="username" placeholder="请输入要设为管理员的用户名" required>
        </div>
        
        <div class="form-actions">
            <a href="{% url 'class_detail' class_id=class_obj.id %}" class="btn btn-secondary">← 返回</a>
            <button type="submit" class="btn btn-primary">✓ 添加管理员</button>
        </div>
    </form>
</div>
{% endblock %}
