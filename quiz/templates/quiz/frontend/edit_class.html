{% extends 'quiz/frontend/base.html' %}

{% block title %}编辑班级 - 在线考试系统{% endblock %}

{% block extra_styles %}
<style>
    .form-container {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #2c3e50;
    }
    
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        transition: border-color 0.3s ease;
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #667eea;
    }
    
    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }
    
    .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 15px;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
        background: #f5f7fa;
        color: #666;
        padding: 10px 20px;
    }
    
    .btn-secondary:hover {
        background: #eee;
    }
    
    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }
    
    .required {
        color: #dc3545;
        margin-left: 4px;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="page-title" style="margin-bottom: 30px;">✏️ 编辑班级</h1>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="code">班级编号</label>
            <input type="text" id="code" name="code" value="{{ class_obj.code }}" readonly style="background: #f5f5f5; cursor: not-allowed;">
            <div class="hint">💡 班级编号不可修改</div>
        </div>
        
        <div class="form-group">
            <label for="name">班级名称 <span class="required">*</span></label>
            <input type="text" id="name" name="name" value="{{ class_obj.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">班级描述</label>
            <textarea id="description" name="description">{{ class_obj.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="join_rule">进班规则 <span class="required">*</span></label>
            <select id="join_rule" name="join_rule" style="width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px;">
                <option value="approval" {% if class_obj.join_rule == 'approval' %}selected{% endif %}>授权进班 - 需要管理员审核</option>
                <option value="auto" {% if class_obj.join_rule == 'auto' %}selected{% endif %}>自动进班 - 无需审核直接加入</option>
            </select>
            <div class="hint">💡 授权进班模式需要管理员手动审核申请；自动进班模式学生输入班级代码后直接加入班级</div>
        </div>
        
        <div class="form-actions">
            <a href="{% url 'class_detail' class_id=class_obj.id %}" class="btn btn-secondary">← 返回</a>
            <button type="submit" class="btn btn-primary">✓ 更新班级</button>
        </div>
    </form>
</div>
{% endblock %}
