<div{% include 'django/forms/widgets/attrs.html' %} class="masked-password-field">
{% for entry in summary %}
<span class="pw-entry">
<strong>{{ entry.label }}</strong>{% if entry.value %}: <code class="pw-masked" data-val="{{ entry.value }}">********</code>{% endif %}
</span>
{% if not forloop.last %}<br>{% endif %}
{% endfor %}
<span class="pw-hint" style="font-size:11px;color:#888;display:block;margin-top:4px;">（点击密码值切换显示，默认隐藏）</span>
</div>
